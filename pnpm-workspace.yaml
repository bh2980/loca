packages:
  - apps/*
  - packages/*
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - "@napi-rs/keyring"
# Newer pnpm (checked with 12.14) reads allowBuilds; onlyBuiltDependencies above is for the pinned 10.18.
# Without it a newer pnpm skips these build scripts and the server cannot load better-sqlite3.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  "@napi-rs/keyring": true
