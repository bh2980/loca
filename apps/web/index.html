<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>loca</title>
    <style>
      /* Static loading frame: plain CSS, before Tailwind loads. Colours follow index.css (canvas, surface-1, border). */
      html, body { margin: 0; background: oklch(0.992 0.002 90); }
      .boot { position: fixed; inset: 0; display: flex; font: 13px/1.5 "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: oklch(0.48 0 0); }
      .boot-side { width: 16rem; flex: none; background: oklch(0.975 0.002 90); border-right: 1px solid oklch(0.915 0.002 90); padding: 12px; box-sizing: border-box; }
      .boot-logo { width: 28px; height: 28px; border-radius: 6px; background: oklch(0.205 0 0); margin-bottom: 20px; }
      .boot-bar { height: 10px; border-radius: 4px; background: oklch(0.94 0.002 90); margin: 14px 4px; }
      .boot-bar.short { width: 60%; }
      .boot-main { flex: 1; display: flex; flex-direction: column; }
      .boot-top { height: 44px; border-bottom: 1px solid oklch(0.915 0.002 90); }
      .boot-text { margin: auto; animation: boot-in 0.2s ease-out 0.3s both; }
      @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-text { animation: none; } }
    </style>
  </head>
  <body>
    <!-- Shown until the app mounts (React replaces #root's content): the app's frame in its own
         colours instead of a blank white page while the bundle and the first data load. -->
    <div id="root">
      <div class="boot" role="status" aria-label="불러오는 중">
        <div class="boot-side"><div class="boot-logo"></div><div class="boot-bar"></div><div class="boot-bar"></div><div class="boot-bar short"></div></div>
        <div class="boot-main"><div class="boot-top"></div><div class="boot-text">loca 불러오는 중…</div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
