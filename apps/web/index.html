<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>loca</title>
    <script>
      /* Theme before first paint (lib/theme.ts owns the key): no white flash in the dark theme. */
      try {
        var t = localStorage.getItem('tw.theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <style>
      /* Static loading frame: plain CSS, before Tailwind loads. Colours are theme.css's chrome, background and border. */
      :root { --b-bg: oklch(0.995 0.002 258); --b-chrome: oklch(0.968 0.006 258); --b-line: oklch(0.91 0.008 258); --b-bar: oklch(0.925 0.012 258); --b-fg: oklch(0.43 0.02 262); --b-logo: oklch(0.53 0.19 262); }
      :root.dark { --b-bg: oklch(0.205 0.012 265); --b-chrome: oklch(0.17 0.011 265); --b-line: oklch(0.17 0.011 265); --b-bar: oklch(0.28 0.016 265); --b-fg: oklch(0.76 0.012 265); --b-logo: oklch(0.8 0.12 192); }
      html, body { margin: 0; background: var(--b-bg); }
      .boot { position: fixed; inset: 0; display: flex; font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--b-fg); }
      .boot-side { width: 16rem; flex: none; background: var(--b-chrome); border-right: 1px solid var(--b-line); padding: 12px; box-sizing: border-box; }
      .boot-logo { width: 28px; height: 28px; border-radius: 6px; background: var(--b-logo); margin-bottom: 20px; }
      .boot-bar { height: 10px; border-radius: 4px; background: var(--b-bar); margin: 14px 4px; }
      .boot-bar.short { width: 60%; }
      .boot-main { flex: 1; display: flex; flex-direction: column; }
      .boot-top { height: 44px; border-bottom: 1px solid var(--b-line); }
      .boot-text { margin: auto; animation: boot-in 0.2s ease-out 0.3s both; }
      @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-text { animation: none; } }
    </style>
  </head>
  <body>
    <!-- Shown until the app mounts (React replaces #root's content): the app's frame in its own
         colours instead of a blank white page while the bundle and the first data load. -->
    <div id="root">
      <div class="boot" role="status" aria-label="불러오는 중">
        <div class="boot-side"><div class="boot-logo"></div><div class="boot-bar"></div><div class="boot-bar"></div><div class="boot-bar short"></div></div>
        <div class="boot-main"><div class="boot-top"></div><div class="boot-text">loca 불러오는 중…</div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
